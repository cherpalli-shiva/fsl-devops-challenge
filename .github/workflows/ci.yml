name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - prod
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 14

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: codebase/rdicidr-0.1.0

      - name: Build project
        run: npm run build
        working-directory: codebase/rdicidr-0.1.0
