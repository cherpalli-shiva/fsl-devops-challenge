name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - prod
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: codebase/rdicidr-0.1.0

      - name: Run linter
        run: npm run lint || echo "Skipping lint (not configured)"
        working-directory: codebase/rdicidr-0.1.0

      - name: Run prettier
        run: npm run prettier || echo "Skipping prettier (not configured)"
        working-directory: codebase/rdicidr-0.1.0

      - name: Run tests
        run: npm test || echo "Skipping tests"
        working-directory: codebase/rdicidr-0.1.0
        
      - name: Build project
        run: npm run build
        working-directory: codebase/rdicidr-0.1.0